# /etc/nginx/sites-available/torii.conf (symlinked from sites-enabled)
#
# Torii base nginx config. Written by torii-base bootstrap.sh.
#
# Convention:
#   /                        → launcher static page (or proxied to root_app)
#   /torii/apps.json         → registry state, served from /opt/torii/registry.json
#   /torii/set-root          → POST endpoint (handled by torii-base fastify sidecar)
#   /<app-name>              → included from /opt/torii/nginx-fragments/<app>.conf
#
# Each installed app drops a file at /opt/torii/nginx-fragments/<name>.conf
# containing exactly one `location /<name> { ... }` block. On `torii reload`
# we validate and reload nginx.

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name TORII_DOMAIN;

    # ACME challenge for certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name TORII_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/TORII_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TORII_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Common security headers. Individual apps may layer more via their fragment.
    add_header X-Frame-Options            "SAMEORIGIN" always;
    add_header X-Content-Type-Options     "nosniff" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()" always;

    # Reasonable body cap; apps can override in their fragment.
    client_max_body_size 20m;

    # ────────────────────────────────────────────────────────────
    # Root: launcher OR proxy to root_app
    # ────────────────────────────────────────────────────────────
    # /opt/torii/root_app.conf is the SINGLE owner of `location = /`. The
    # torii-base sidecar rewrites it on set-root / homepage activation:
    #   • unset    → serve the launcher static page
    #   • <app>    → 302 redirect to /<app>/
    #   • homepage → serve the rendered personal homepage
    # Do not add a second `location = /` in this server block — two exact-match
    # location blocks is a fatal nginx error.
    include /opt/torii/root_app.conf;

    # .mjs is not in nginx's default mime.types on older distros; without an
    # explicit JS content-type the browser refuses to import it as a module
    # (the launcher and homepage editor share homepage-render.mjs). Regex
    # locations win over the /assets/ prefix, so this only affects .mjs files.
    location ~ \.mjs$ {
        root /opt/torii/launcher;
        default_type text/javascript;
        access_log off;
        expires 1h;
    }

    location /assets/ {
        root /opt/torii/launcher;
        access_log off;
        expires 1h;
    }

    # ────────────────────────────────────────────────────────────
    # Torii base API — served by the torii-base sidecar
    # ────────────────────────────────────────────────────────────
    location /torii/ {
        proxy_pass http://127.0.0.1:8780/torii/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ────────────────────────────────────────────────────────────
    # Installed-app fragments
    # ────────────────────────────────────────────────────────────
    # Each app installer drops a <name>.conf here containing one
    # `location /<name> { ... }` block.
    include /opt/torii/nginx-fragments/*.conf;
}
