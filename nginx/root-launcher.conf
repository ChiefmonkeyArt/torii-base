# /opt/torii/root_app.conf — default state (empty)
#
# Written by `torii set-root <name>`. When root_app is unset, this file is
# empty and nginx falls through to the launcher's `location = /`.
#
# When set (e.g. `torii set-root continuum`), this file contains:
#
#   location = / {
#       return 302 /continuum/;
#   }
#
# We use a 302 redirect (not a rewrite) so bookmarks stay honest about which
# app they land in, and so a subsequent `torii set-root none` cleanly reverts.
