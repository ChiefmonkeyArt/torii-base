# /opt/torii/root_app.conf — the SINGLE owner of `location = /`.
#
# torii.conf includes this file and declares no `location = /` of its own
# (two exact-match location blocks in one server is a fatal nginx error).
# The torii-base sidecar rewrites this file — always exactly one location
# block — and reconciles it against registry.json on boot.
#
# Default (root_app unset) — serve the launcher static page:
#
#   location = / {
#       root /opt/torii/launcher;
#       try_files /index.html =404;
#   }
#
# When an app is promoted (e.g. `torii set-root continuum`):
#
#   location = / {
#       return 302 /continuum/;
#   }
#
# When the personal homepage is activated (`torii set-root homepage`):
#
#   location = / {
#       root /opt/torii/homepage;
#       try_files /index.html =404;
#   }
#
# App promotion uses a 302 (not a rewrite) so bookmarks stay honest about
# which app they land in, and so `torii set-root none` cleanly reverts. The
# homepage is served statically in-place — no redirect hop.
